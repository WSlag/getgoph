<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GetGo - Your Cargo Marketplace</title>
  <desc id="desc">GetGo social preview card with Ember Glyph mark, marketplace tagline.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="emberMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="orbLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1326" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E162B" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2A1307" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <circle cx="1060" cy="138" r="160" fill="url(#orbLight)"/>
  <circle cx="1120" cy="442" r="240" fill="url(#orbLight)"/>
  <circle cx="90" cy="590" r="220" fill="#FFFFFF" opacity="0.16"/>
  <rect x="58" y="78" width="760" height="474" rx="22" fill="url(#panelGradient)" filter="url(#softShadow)"/>
  <rect x="58" y="78" width="760" height="10" fill="#ea580c"/>
  <!-- Mini mark in panel header -->
  <g transform="translate(108,108) scale(0.1171875)">
    <rect width="512" height="512" rx="112" fill="#ffffff"/>
    <g fill="url(#emberMark)">
      <path d="M 158 148 H 318 A 28 28 0 0 1 346 176 V 208 H 288 V 186 A 10 10 0 0 0 278 176 H 186 A 30 30 0 0 0 156 206 V 314 A 30 30 0 0 0 186 344 H 280 A 28 28 0 0 0 308 316 V 258 H 234 L 264 228 H 346 V 316 A 58 58 0 0 1 288 374 H 186 A 58 58 0 0 1 128 314 V 206 A 58 58 0 0 1 158 148 Z"/>
    </g>
    <path d="M 276 242 L 338 288 L 276 334 Z" fill="#ffffff"/>
  </g>
  <text x="184" y="160" fill="#D9DEE7" font-family="Outfit, Poppins, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="0.5">GetGo</text>
  <text x="108" y="248" fill="#FFFFFF" font-family="Outfit, Poppins, Arial, sans-serif" font-size="70" font-weight="800">
    <tspan x="108" dy="0">Your Cargo</tspan>
    <tspan x="108" dy="82">Marketplace</tspan>
  </text>
  <text x="108" y="404" fill="#DEE2EB" font-family="Outfit, Poppins, Arial, sans-serif" font-size="24" font-weight="500">
    <tspan x="108" dy="0">Connect with trusted truckers</tspan>
    <tspan x="108" dy="36">across the Philippines.</tspan>
  </text>
  <rect x="108" y="452" width="326" height="64" rx="32" fill="#ffffff" opacity="0.16"/>
  <text x="136" y="494" fill="#FFEFE2" font-family="Outfit, Poppins, Arial, sans-serif" font-size="40" font-weight="700">getgoph.com</text>
  <!-- Hero mark right side: white squircle + Ember Glyph -->
  <g transform="translate(860,185)" filter="url(#softShadow)">
    <rect width="260" height="260" rx="57" fill="#ffffff"/>
    <g transform="scale(0.5078125)">
      <g fill="url(#emberMark)">
        <path d="M 158 148 H 318 A 28 28 0 0 1 346 176 V 208 H 288 V 186 A 10 10 0 0 0 278 176 H 186 A 30 30 0 0 0 156 206 V 314 A 30 30 0 0 0 186 344 H 280 A 28 28 0 0 0 308 316 V 258 H 234 L 264 228 H 346 V 316 A 58 58 0 0 1 288 374 H 186 A 58 58 0 0 1 128 314 V 206 A 58 58 0 0 1 158 148 Z"/>
      </g>
      <path d="M 276 242 L 338 288 L 276 334 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
