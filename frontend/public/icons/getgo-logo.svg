<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GetGo — Ember Glyph</title>
  <desc id="desc">Ember gradient squircle with geometric G and forward-arrow cut. Professional mark for PWA icon.</desc>
  <defs>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- 22% radius = 112 on 512 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#ember)"/>
  <!-- Centered glyph: optimized for 16px favicon legibility, single idea -->
  <!-- Outer safe padding 10% retained; glyph within 80% circle -->
  <g fill="white">
    <path d="M 158 148 H 318 A 28 28 0 0 1 346 176 V 208 H 288 V 186 A 10 10 0 0 0 278 176 H 186 A 30 30 0 0 0 156 206 V 314 A 30 30 0 0 0 186 344 H 280 A 28 28 0 0 0 308 316 V 258 H 234 L 264 228 H 346 V 316 A 58 58 0 0 1 288 374 H 186 A 58 58 0 0 1 128 314 V 206 A 58 58 0 0 1 158 148 Z"/>
  </g>
  <!-- Forward arrow negative space: motion / logistics -->
  <path d="M 276 242 L 338 288 L 276 334 Z" fill="url(#ember)"/>
</svg>
